<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Symmetry · Mengnan</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    .sym-layout { display: grid; grid-template-columns: 280px 1fr; gap: 2rem; align-items: start; }
    @media (max-width: 800px) { .sym-layout { grid-template-columns: 1fr; } }

    .sym-panel {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.5rem; position: sticky; top: 80px;
    }

    .sym-panel h3 {
      font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-dim); margin-bottom: 1rem;
    }

    .group-list {
      list-style: none; display: flex; flex-direction: column; gap: 4px;
    }

    .group-list li button {
      width: 100%; text-align: left; background: transparent;
      border: 1px solid transparent; border-radius: 6px;
      padding: 0.4em 0.7em; cursor: pointer; color: var(--text-dim);
      font-family: var(--mono); font-size: 0.75rem;
      display: flex; justify-content: space-between; align-items: center;
      transition: all 0.15s;
    }

    .group-list li button:hover { border-color: var(--border); color: var(--text); }
    .group-list li button.active { border-color: var(--accent); color: var(--accent); background: rgba(108,99,255,0.1); }
    .group-list li button .g-name { font-size: 0.65rem; color: var(--text-dim); }
    .group-list li button.active .g-name { color: var(--accent); opacity: 0.7; }

    .color-row { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
    .color-swatch {
      width: 24px; height: 24px; border-radius: 4px; cursor: pointer;
      border: 2px solid transparent; transition: border-color 0.15s;
    }
    .color-swatch.active { border-color: #fff; }

    .anim-btn {
      width: 100%; margin-top: 1rem;
      background: rgba(108,99,255,0.15); border: 1px solid var(--accent);
      color: var(--accent); border-radius: 6px; padding: 0.5em;
      font-family: var(--mono); font-size: 0.75rem; cursor: pointer;
      transition: background 0.15s;
    }
    .anim-btn:hover { background: rgba(108,99,255,0.3); }

    .sym-canvas-area {
      border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
    }

    #symmetry-canvas { display: block; width: 100%; }

    .info-box {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.25rem 1.5rem; margin-top: 1.5rem;
      font-size: 0.875rem;
    }

    .info-box h4 { font-size: 1rem; margin-bottom: 0.5rem; }
    .info-box p { color: var(--text-dim); line-height: 1.7; }
    .info-box .badge {
      display: inline-block; font-family: var(--mono); font-size: 0.7rem;
      background: rgba(108,99,255,0.2); color: var(--accent);
      padding: 0.2em 0.6em; border-radius: 4px; margin-bottom: 0.5rem;
    }

    .slider-row { display: flex; align-items: center; gap: 0.75rem; margin-top: 0.75rem; }
    .slider-row label { font-family: var(--mono); font-size: 0.65rem; color: var(--text-dim); min-width: 60px; }
    .slider-row input[type=range] { flex: 1; accent-color: var(--accent); }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a href="../index.html" class="nav-logo">MC</a>
      <ul class="nav-links">
        <li><a href="../index.html#projects">Projects</a></li>
        <li><a href="../index.html#about">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="page-hero">
      <a href="../index.html" class="back-link">← Back</a>
      <h1>Classic<br><span style="color:var(--text-dim);font-weight:400">Symmetry</span></h1>
      <p>Mathematical symmetry groups create stunning geometric patterns. Select a wallpaper group and watch the tiling come alive.</p>
    </div>

    <div class="page-content">
      <div class="sym-layout">

        <!-- Control Panel -->
        <div class="sym-panel">
          <h3>Wallpaper Group</h3>
          <ul class="group-list" id="group-list"></ul>

          <h3 style="margin-top:1.25rem">Colors</h3>
          <div class="color-row" id="color-row"></div>

          <div class="slider-row">
            <label>Scale</label>
            <input type="range" id="scale-slider" min="20" max="120" value="60">
          </div>
          <div class="slider-row">
            <label>Rotation</label>
            <input type="range" id="rot-slider" min="0" max="360" value="0">
          </div>
          <div class="slider-row">
            <label>Complexity</label>
            <input type="range" id="cplx-slider" min="1" max="6" value="3">
          </div>

          <button class="anim-btn" id="anim-btn">▶ Animate</button>
        </div>

        <!-- Canvas Area -->
        <div>
          <div class="sym-canvas-area">
            <canvas id="symmetry-canvas" height="520"></canvas>
          </div>
          <div class="info-box" id="info-box">
            <div class="badge" id="info-badge">p1</div>
            <h4 id="info-name">Translation only</h4>
            <p id="info-desc"></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2024 Mengnan Cui · 17 crystallographic wallpaper groups</p>
    </div>
  </footer>

  <script>
  // ── Wallpaper group definitions ──────────────────────────────────────────
  const GROUPS = [
    { id:'p1',  name:'Translation',      desc:'The simplest symmetry: only translational symmetry. The fundamental domain tiles the plane with no reflections or rotations.' },
    { id:'p2',  name:'2-fold rotation',  desc:'Contains 180° rotational symmetry (order 2). No reflections. The lattice has 2-fold rotation points.' },
    { id:'pm',  name:'Mirror reflection',desc:'Two families of parallel mirror lines. No rotational symmetry beyond 180°. Used in striped wallpaper patterns.' },
    { id:'pg',  name:'Glide reflection', desc:'Contains glide reflections but no ordinary mirrors. Produces a staggered, offset feel.' },
    { id:'cm',  name:'Mirror + glide',   desc:'One family of mirrors and one family of glide reflections. Generates a centered rectangular lattice.' },
    { id:'p2mm',name:'2-fold + mirrors', desc:'2-fold rotation with two perpendicular mirror lines. Produces a strong cross-symmetric pattern.' },
    { id:'p4',  name:'4-fold rotation',  desc:'Contains 4-fold (90°) rotational symmetry. The pattern looks the same rotated by 90°.' },
    { id:'p4mm',name:'4-fold + mirrors', desc:'The full symmetry of a square lattice: 4-fold rotation plus mirror lines. Classic tile pattern.' },
    { id:'p3',  name:'3-fold rotation',  desc:'Triangular lattice with 3-fold (120°) rotational symmetry. No reflections.' },
    { id:'p6',  name:'6-fold rotation',  desc:'Hexagonal lattice with 6-fold (60°) rotational symmetry. Snowflake-like.' },
    { id:'p6mm',name:'6-fold + mirrors', desc:'The most symmetric wallpaper group: 6-fold rotation plus mirrors. Produces rich hexagonal patterns.' },
  ];

  const PALETTES = [
    ['#6c63ff','#ff6584','#43e97b','#f7971e'],
    ['#00b4d8','#0077b6','#90e0ef','#caf0f8'],
    ['#f72585','#7209b7','#3a0ca3','#4361ee'],
    ['#ffd166','#ef476f','#06d6a0','#118ab2'],
    ['#e8e8e8','#aaaaaa','#555555','#111111'],
    ['#ff9f43','#ee5a24','#feca57','#ff6b6b'],
  ];

  let currentGroup = GROUPS[0];
  let currentPalette = PALETTES[0];
  let scale = 60;
  let rotation = 0;
  let complexity = 3;
  let animating = false;
  let animFrame = null;
  let phase = 0;

  // ── Build group list ─────────────────────────────────────────────────────
  const groupList = document.getElementById('group-list');
  GROUPS.forEach(g => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.innerHTML = `<span>${g.id}</span><span class="g-name">${g.name}</span>`;
    btn.addEventListener('click', () => { currentGroup = g; setActive(); draw(); });
    li.appendChild(btn);
    groupList.appendChild(li);
  });

  // ── Build color swatches ─────────────────────────────────────────────────
  const colorRow = document.getElementById('color-row');
  PALETTES.forEach((pal, i) => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (i === 0 ? ' active' : '');
    sw.style.background = `linear-gradient(135deg, ${pal[0]} 50%, ${pal[1]} 50%)`;
    sw.addEventListener('click', () => {
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      currentPalette = pal;
      draw();
    });
    colorRow.appendChild(sw);
  });

  function setActive() {
    document.querySelectorAll('#group-list button').forEach((btn, i) => {
      btn.classList.toggle('active', GROUPS[i] === currentGroup);
    });
    document.getElementById('info-badge').textContent = currentGroup.id;
    document.getElementById('info-name').textContent = currentGroup.name;
    document.getElementById('info-desc').textContent = currentGroup.desc;
  }
  setActive();
  document.querySelector('#group-list button').classList.add('active');

  // ── Sliders ──────────────────────────────────────────────────────────────
  document.getElementById('scale-slider').addEventListener('input', e => { scale = +e.target.value; draw(); });
  document.getElementById('rot-slider').addEventListener('input', e => { rotation = +e.target.value; draw(); });
  document.getElementById('cplx-slider').addEventListener('input', e => { complexity = +e.target.value; draw(); });

  document.getElementById('anim-btn').addEventListener('click', () => {
    animating = !animating;
    document.getElementById('anim-btn').textContent = animating ? '⏹ Stop' : '▶ Animate';
    if (animating) animate(); else cancelAnimationFrame(animFrame);
  });

  function animate() {
    phase += 0.01;
    rotation = (rotation + 0.3) % 360;
    document.getElementById('rot-slider').value = rotation;
    draw();
    animFrame = requestAnimationFrame(animate);
  }

  // ── Drawing engine ───────────────────────────────────────────────────────
  const canvas = document.getElementById('symmetry-canvas');
  let W, H;

  function resize() {
    W = canvas.offsetWidth || 700;
    H = 520;
    canvas.width = W;
    canvas.height = H;
  }

  function motif(ctx, x, y, s, colors, cplx, ph) {
    const c = colors;
    // Draw a small repeating motif that will be tiled
    for (let k = 0; k < cplx; k++) {
      const a = (k / cplx) * Math.PI * 2 + ph;
      const r = s * 0.3 * (k + 1) / cplx;
      const px = x + Math.cos(a) * r;
      const py = y + Math.sin(a) * r;
      ctx.beginPath();
      ctx.arc(px, py, s * 0.12, 0, Math.PI * 2);
      ctx.fillStyle = c[k % c.length] + 'cc';
      ctx.fill();
    }
    // Center dot
    ctx.beginPath();
    ctx.arc(x, y, s * 0.1, 0, Math.PI * 2);
    ctx.fillStyle = colors[0] + '88';
    ctx.fill();
    // Connecting lines
    ctx.strokeStyle = colors[1] + '44';
    ctx.lineWidth = 0.8;
    for (let k = 0; k < cplx; k++) {
      const a = (k / cplx) * Math.PI * 2 + ph;
      const r = s * 0.3 * (k + 1) / cplx;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
      ctx.stroke();
    }
  }

  function drawGroup(ctx, id, cx, cy, s, colors, cplx, ph, rotRad) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotRad);

    switch (id) {
      case 'p1':
        motif(ctx, 0, 0, s, colors, cplx, ph);
        break;
      case 'p2':
        motif(ctx, 0, 0, s, colors, cplx, ph);
        ctx.save(); ctx.rotate(Math.PI); motif(ctx, 0, 0, s, colors, cplx, ph); ctx.restore();
        break;
      case 'pm':
        motif(ctx, 0, 0, s, colors, cplx, ph);
        ctx.save(); ctx.scale(-1, 1); motif(ctx, 0, 0, s, colors, cplx, ph); ctx.restore();
        break;
      case 'pg':
        motif(ctx, -s*0.2, 0, s, colors, cplx, ph);
        ctx.save(); ctx.scale(-1, 1); ctx.translate(0, s*0.4);
        motif(ctx, -s*0.2, 0, s, colors, cplx, ph); ctx.restore();
        break;
      case 'cm':
        motif(ctx, 0, 0, s, colors, cplx, ph);
        ctx.save(); ctx.scale(1, -1); motif(ctx, 0, 0, s, colors, cplx, ph); ctx.restore();
        ctx.save(); ctx.scale(-1, 1); motif(ctx, 0, 0, s, colors, cplx, ph); ctx.restore();
        break;
      case 'p2mm':
        [1,-1].forEach(sx => [1,-1].forEach(sy => {
          ctx.save(); ctx.scale(sx, sy); motif(ctx, 0, 0, s, colors, cplx, ph); ctx.restore();
        }));
        break;
      case 'p4':
        for (let k = 0; k < 4; k++) {
          ctx.save(); ctx.rotate(k * Math.PI / 2); motif(ctx, s*0.2, 0, s, colors, cplx, ph); ctx.restore();
        }
        break;
      case 'p4mm':
        for (let k = 0; k < 4; k++) {
          ctx.save(); ctx.rotate(k * Math.PI / 2);
          motif(ctx, s*0.2, 0, s, colors, cplx, ph);
          ctx.scale(1, -1); motif(ctx, s*0.2, 0, s, colors, cplx, ph);
          ctx.restore();
        }
        break;
      case 'p3':
        for (let k = 0; k < 3; k++) {
          ctx.save(); ctx.rotate(k * 2 * Math.PI / 3); motif(ctx, s*0.25, 0, s, colors, cplx, ph); ctx.restore();
        }
        break;
      case 'p6':
        for (let k = 0; k < 6; k++) {
          ctx.save(); ctx.rotate(k * Math.PI / 3); motif(ctx, s*0.25, 0, s, colors, cplx, ph); ctx.restore();
        }
        break;
      case 'p6mm':
        for (let k = 0; k < 6; k++) {
          ctx.save(); ctx.rotate(k * Math.PI / 3);
          motif(ctx, s*0.25, 0, s, colors, cplx, ph);
          ctx.scale(1, -1); motif(ctx, s*0.25, 0, s, colors, cplx, ph);
          ctx.restore();
        }
        break;
      default:
        motif(ctx, 0, 0, s, colors, cplx, ph);
    }
    ctx.restore();
  }

  function draw() {
    resize();
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, W, H);

    const s = scale;
    const rotRad = (rotation * Math.PI) / 180;
    const ph = phase;

    // Choose grid step based on group
    const steps = {
      p3: s * 1.73, p6: s * 1.73, p6mm: s * 1.73
    };
    const stepX = steps[currentGroup.id] || s * 1.2;
    const stepY = steps[currentGroup.id] || s * 1.2;

    // Hex offset for 6-fold groups
    const hexGroup = ['p3','p6','p6mm'].includes(currentGroup.id);

    const cols = Math.ceil(W / stepX) + 2;
    const rows = Math.ceil(H / stepY) + 2;

    for (let row = -1; row <= rows; row++) {
      for (let col = -1; col <= cols; col++) {
        let cx = col * stepX;
        let cy = row * stepY;
        if (hexGroup && row % 2 !== 0) cx += stepX * 0.5;
        drawGroup(ctx, currentGroup.id, cx, cy, s, currentPalette, complexity, ph, rotRad);
      }
    }
  }

  window.addEventListener('resize', draw);
  draw();
  </script>
</body>
</html>
