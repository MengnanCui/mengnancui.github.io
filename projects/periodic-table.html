<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晶体结构博物馆 · Crystal Structure Museum</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=DM+Mono:wght@400&family=Noto+Serif+SC:wght@300;400&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:Lato,'Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:1.65;color:#404040;background:#edf0f2;}
/* ── RTD SIDEBAR ── */
.wy-nav-side{position:fixed;top:0;left:0;width:300px;height:100%;background:#343131;z-index:200;display:flex;flex-direction:column;transition:transform .25s;}
.wy-side-scroll{overflow-y:auto;height:100%;padding-bottom:3rem;}
.wy-side-nav-search{background:#2980b9;padding:.809rem;}
.wy-side-nav-search>a{display:block;color:#fcfcfc;font-size:1rem;font-weight:700;padding:.25em 0 .1em;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wy-side-nav-search>a:hover{text-decoration:underline;}
.wy-side-nav-ver{color:rgba(255,255,255,.6);font-size:.75rem;margin-bottom:.6em;}
.wy-side-nav-search input[type=text]{width:100%;border-radius:50px;padding:5px 12px;border:0;font-size:.8rem;background:#fcfcfc;color:#404040;outline:none;}
/* nav tree */
.wy-menu-vertical p.caption{color:#9b9b9b;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:.7rem 1.618rem .2rem;margin-top:.5rem;}
.wy-menu-vertical ul{list-style:none;}
.wy-menu-vertical li a{display:block;color:#d9d9d9;padding:.4045rem 1.618rem;font-size:.875rem;text-decoration:none;transition:background .1s;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;font-family:Lato,sans-serif;}
.wy-menu-vertical li a:hover{background:#4e4a4a;color:#fff;}
.wy-menu-vertical li.current>a{background:#2980b9;color:#fff;}
.wy-nav-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle;flex-shrink:0;}
/* ── RTD CONTENT AREA ── */
.wy-nav-content-wrap{margin-left:300px;background:#fcfcfc;min-height:100vh;}
.wy-nav-top{display:none;background:#2980b9;color:#fff;padding:.5em .809em;align-items:center;gap:.7em;}
.wy-nav-top a{color:#fff;text-decoration:none;font-weight:700;font-size:.95rem;}
.wy-nav-top-btn{background:none;border:none;color:#fff;font-size:1.4em;cursor:pointer;line-height:1;padding:0;}
.wy-nav-content{max-width:800px;margin:0 auto;padding:1.618em 3.236em 4em;}
/* ── RST CONTENT TYPOGRAPHY ── */
.rst-content h1{font-size:175%;font-weight:700;color:#404040;border-bottom:1px solid #e1e4e5;padding-bottom:.5rem;margin-bottom:.8rem;}
.rst-content h2{font-size:150%;font-weight:700;color:#404040;border-bottom:1px solid #e1e4e5;padding-bottom:.3rem;margin:2.5em 0 .8em;}
.rst-content p{font-size:14px;line-height:1.7;margin-bottom:.7em;}
/* admonition (note / tip) */
.admonition{padding:12px 14px;margin-bottom:14px;border-left:3px solid;}
.admonition.note{background:#e7f2fa;border-color:#6ab0de;}
.admonition.tip{background:#dbfaf4;border-color:#1abc9c;}
.admonition-title{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;display:block;}
.admonition.note .admonition-title{color:#2980b9;}
.admonition.tip .admonition-title{color:#0d8c6c;}
.admonition p{margin:0;font-size:.88rem;color:#404040;font-family:'Noto Serif SC',serif;line-height:1.72;}
/* field table (物理性质) */
.field-list{border-collapse:collapse;width:100%;margin:.4em 0 .9em;font-size:.82rem;}
.field-list th{background:#f3f6f6;color:#2980b9;font-weight:700;padding:5px 10px;border:1px solid #e1e4e5;text-align:left;white-space:nowrap;font-family:'DM Mono',monospace;}
.field-list td{padding:5px 10px;border:1px solid #e1e4e5;font-family:'DM Mono',monospace;color:#404040;}
/* tags */
.tag{display:inline-block;padding:1px 6px;border-radius:2px;font-size:.72rem;font-family:'DM Mono',monospace;border:1px solid;}
.tag-oxide{color:#be185d;border-color:rgba(190,24,93,.2);background:rgba(190,24,93,.06);}
.tag-metal{color:#78350f;border-color:rgba(120,53,15,.2);background:rgba(120,53,15,.06);}
.tag-halide{color:#065f46;border-color:rgba(6,95,70,.2);background:rgba(6,95,70,.06);}
.tag-sulfide{color:#7c2d12;border-color:rgba(124,45,18,.2);background:rgba(124,45,18,.06);}
.tag-hex{color:#1e40af;border-color:rgba(30,64,175,.2);background:rgba(30,64,175,.06);}
.tag-trig{color:#5b21b6;border-color:rgba(91,33,182,.2);background:rgba(91,33,182,.06);}
.tag-tet{color:#134e4a;border-color:rgba(19,78,74,.2);background:rgba(19,78,74,.06);}
.tag-cub{color:#1d4ed8;border-color:rgba(29,78,216,.2);background:rgba(29,78,216,.06);}
/* bravais divider */
.bravais-divider{margin:3em 0 1.2em;border-bottom:1px solid #e1e4e5;padding-bottom:.4em;}
.bravais-label{font-size:1.2rem;font-weight:700;color:#404040;}
.bravais-sub{font-size:.78rem;color:#9b9b9b;margin-top:.2em;font-family:'DM Mono',monospace;}
/* crystal section */
.crystal-section{margin-bottom:3.5em;scroll-margin-top:1.5em;}
.section-header{margin-bottom:.9em;padding-bottom:.5em;border-bottom:1px solid #e1e4e5;}
.section-en{font-size:1.35rem;font-weight:700;color:#404040;}
.section-zh{font-size:.85rem;color:#9b9b9b;margin-top:1px;}
.section-formula{font-family:'DM Mono',monospace;font-size:.82rem;color:#2980b9;background:#e7f2fa;border:1px solid #6ab0de;padding:1px 6px;border-radius:2px;margin-top:5px;display:inline-block;}
.section-meta{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;}
.section-sg{font-family:'DM Mono',monospace;font-size:.75rem;color:#9b9b9b;}
/* crystal card: viewer + info */
.crystal-card{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start;margin:.9em 0;}
@media(max-width:900px){.crystal-card{grid-template-columns:1fr;}}
/* 3D canvas — keep dark */
.canvas-wrap{position:relative;background:#111827;border:1px solid #374151;border-radius:3px;overflow:hidden;aspect-ratio:1;cursor:grab;}
.canvas-wrap:active{cursor:grabbing;}
canvas.crystal-canvas{width:100%!important;height:100%!important;display:block;}
.view-toggle{position:absolute;top:7px;left:7px;display:flex;gap:3px;z-index:10;}
.vt-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.5);border-radius:2px;padding:2px 8px;font-size:11px;cursor:pointer;font-family:'DM Mono',monospace;transition:background .1s;}
.vt-btn.active{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.5);color:#fff;}
.canvas-badge{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.55);border-radius:2px;padding:2px 6px;font-size:10px;color:rgba(255,255,255,.4);}
/* info panel */
.info-panel{display:flex;flex-direction:column;gap:1em;}
.info-caption{color:#2980b9;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;font-family:'DM Mono',monospace;}
.info-text{font-family:'Noto Serif SC',serif;font-size:.88rem;line-height:1.85;color:#404040;}
.atom-legend{display:flex;flex-wrap:wrap;gap:6px;}
.atom-item{display:flex;align-items:center;gap:5px;font-size:.8rem;}
.atom-swatch{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.related-list{display:flex;flex-wrap:wrap;gap:4px;}
.related-chip{padding:1px 7px;background:#f3f6f6;border:1px solid #e1e4e5;border-radius:2px;font-size:.8rem;color:#404040;}
.compare-note{background:#dbfaf4;border-left:3px solid #1abc9c;padding:10px 14px;margin-bottom:14px;font-size:.88rem;color:#065f46;font-family:'Noto Serif SC',serif;line-height:1.72;}
/* footer */
.rst-footer{margin-top:3em;padding-top:1em;border-top:1px solid #e1e4e5;color:#9b9b9b;font-size:.75rem;text-align:center;}
/* scrollbar */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:2px;}
/* mobile */
@media(max-width:768px){
  .wy-nav-side{transform:translateX(-300px);}
  .wy-nav-side.open{transform:translateX(0);}
  .wy-nav-content-wrap{margin-left:0;}
  .wy-nav-top{display:flex;}
  .wy-nav-content{padding:1em 1.2em;}
}
</style>
</head>

      <div class="rst-content">
        <h1>晶体结构博物馆 <small style="font-size:55%;color:#9b9b9b;font-weight:400">Crystal Structure Museum</small></h1>
        <div class="admonition note" style="margin-bottom:1.5em;">
          <span class="admonition-title">关于本页面</span>
          <p>共收录 13 种经典无机晶体结构，涵盖 7 大晶系。每个结构配有可交互三维模型（拖动旋转 · 滚轮缩放 · 双击重置），支持原胞/超胞视图切换。</p>
        </div>
        <div id="mainContent"></div>
        <div class="rst-footer">晶体结构基于标准无机晶体结构数据 · 数据来源：ICSD 标准晶胞参数</div>
      </div>
    </div>
  </div>

<script>
const CRYSTALS = [
  {id:'bcc',bravais:'cubic',en:'BCC Metal',zh:'体心立方金属',formula:'α-Fe / W / Cr',
   system:'立方晶系 Cubic',sg:'Im3̄m (No.229)',
   glance:'体心1个 + 角顶8×⅛ = 2原子/胞；8近邻沿体对角线成键，高强度低塑性',
   tags:[{l:'金属',c:'tag-metal'},{l:'Cubic',c:'tag-cub'}],

   props:{'配位数':'8','次近邻':'6','填充效率':'68%','典型代表':'Fe·W·Cr·Mo'},
   related:['FCC面心立方 Cu·Al·Au·Ni','HCP六方密堆 Mg·Ti·Zn','α-Fe铁素体（室温稳定）','γ-Fe奥氏体（912°C+）'],

  {id:'fcc',bravais:'cubic',en:'FCC Metal',zh:'面心立方金属',formula:'Cu / Au / Al / Ni',
   system:'立方晶系 Cubic',sg:'Fm3̄m (No.225)',
   glance:'角顶8×⅛ + 面心6×½ = 4原子/胞；12近邻沿面对角线，堆积效率最高74%',
   tags:[{l:'金属',c:'tag-metal'},{l:'Cubic',c:'tag-cub'}],
   origin:'面心立方（FCC）是Cu族、Pt族金属典型结构，亦是ABCABC层序六方密堆积的立方等价形式。Cu、Ag、Au、Al、Ni、Pt、Pb均为FCC，延展性极好是其标志。',

   props:{'配位数':'12','填充效率':'74%','有效滑移系':'12','层序':'ABCABC'},
   related:['HCP六方密堆 Mg·Ti·Zn（同密度）','BCC体心立方 Fe·W','Ag（最高导电率）','Pt·Pd（催化剂）'],
   atoms:[{label:'Cu',color:'#f59e0b'}],
   buildPrim:(sc,v)=>buildFCC(sc,v,false),buildSuper:(sc,v)=>buildFCC(sc,v,true)},
  {id:'nacl',bravais:'cubic',en:'Rock Salt',zh:'岩盐结构',formula:'NaCl',

   tags:[{l:'卤化物',c:'tag-halide'},{l:'Cubic',c:'tag-cub'}],
   origin:'因天然矿物岩盐（Halite）命名，1913年布拉格父子X射线衍射解析，是最早被解析的晶体结构之一。MgO、FeO等重要氧化物均为岩盐型。',
   features:'Na⁺、Cl⁻各自形成FCC子格，两套FCC格沿(1/2,0,0)方向位移，相互穿插。每离子被6个异号离子八面体配位（6:6配位）。{100}完全解理面平整光亮。',
   insight:'NaCl的(001)解理面光滑：正是因为{100}面上同号离子构成的排斥将晶体劈开，而{111}面上阴阳离子交替反而不易解理——这直接验证了岩盐结构模型。',
   props:{'配位数':'6–6','晶格参数':'a=5.64 Å','密度':'2.16 g/cm³','熔点':'801°C'},
   related:['KCl·LiF·MgO·FeO·NiO','TiN·ZrN氮化物硬涂层','CaO·BaO碱土氧化物','CO（等电子体，同构）'],
   atoms:[{label:'Na⁺',color:'#7ba7ff'},{label:'Cl⁻',color:'#4dffb4'}],
   buildPrim:(sc,v)=>buildNaCl(sc,v,false),buildSuper:(sc,v)=>buildNaCl(sc,v,true)},
  {id:'cscl',bravais:'cubic',en:'Cesium Chloride',zh:'氯化铯结构',formula:'CsCl',

   insight:'CsCl在469°C加热后转变为NaCl型——这直接证明了离子半径比决定结构型别：高温下热膨胀使有效半径比降至NaCl型稳定区间。',
   props:{'配位数':'8–8','a':'4.12 Å','密度':'3.99 g/cm³','熔点':'646°C'},
   related:['CsBr·CsI（同型）','TlCl·TlBr','NH₄Cl高温相','β-AgI'],
   atoms:[{label:'Cs⁺',color:'#ffb347'},{label:'Cl⁻',color:'#4dffb4'}],

  {id:'zincblende',bravais:'cubic',en:'Zinc Blende',zh:'闪锌矿结构',formula:'ZnS',

   glance:'S²⁻ FCC格 + Zn²⁺占半数四面体空隙：4配位sp³型，无对称中心→压电性',
   tags:[{l:'硫化物',c:'tag-sulfide'},{l:'Cubic',c:'tag-cub'}],
   origin:'"闪锌矿"（Sphalerite）得名于希腊语"欺骗性"，因外观似方铅矿。GaAs、InP等重要半导体的结构原型。',
   features:'S²⁻形成FCC格（4/胞），Zn²⁺占4个交替四面体空隙。Zn–S键sp³四面体，键角109.5°。无对称中心→压电、非线性光学活性。层序ABCABC，与纤锌矿（ABABAB）互为多型。',

   props:{'配位数':'4–4','a':'5.41 Å','禁带宽度':'3.54 eV','压电性':'有（无反演中心）'},
   related:['GaAs·InP·GaP（III-V半导体）','ZnSe·CdTe（II-VI）','立方BN·SiC（3C）','金刚石C（同拓扑，单元素）'],
   atoms:[{label:'Zn²⁺',color:'#ff7baf'},{label:'S²⁻',color:'#ffe17b'}],

   compareNote:'⚡ 闪锌矿 vs 方铅矿：Zn²⁺小（r=0.74Å），半径比0.40在四面体配位区间；Pb²⁺大（r=1.19Å），半径比0.65在八面体配位区间，故采用NaCl型。'},
  {id:'galena',bravais:'cubic',en:'Galena',zh:'方铅矿结构',formula:'PbS',

   props:{'配位数':'6–6','a':'5.94 Å','密度':'7.6 g/cm³','带隙':'0.37 eV（近红外）'},

   buildPrim:(sc,v)=>buildGalena(sc,v,false),buildSuper:(sc,v)=>buildGalena(sc,v,true)},
  {id:'diamond',bravais:'cubic',en:'Diamond',zh:'金刚石结构',formula:'C',

function createViewer(canvas){
  const W=canvas.offsetWidth||420,H=canvas.offsetHeight||420;
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(W,H);renderer.setClearColor(0x10101c,1);
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(42,W/H,0.01,300);
  scene.add(new THREE.AmbientLight(0xffffff,0.55));
  const d1=new THREE.DirectionalLight(0xffffff,0.9);d1.position.set(6,10,8);scene.add(d1);
  const d2=new THREE.DirectionalLight(0x8899ff,0.35);d2.position.set(-5,-4,-6);scene.add(d2);
  const d3=new THREE.DirectionalLight(0xffffff,0.2);d3.position.set(0,-8,0);scene.add(d3);
  let theta=0.6,phi=0.75,radius=12,dragging=false,prev={x:0,y:0};
  const target=new THREE.Vector3(0,0,0);
  function updateCam(){
    camera.position.set(
      target.x+radius*Math.sin(phi)*Math.sin(theta),
      target.y+radius*Math.cos(phi),
      target.z+radius*Math.sin(phi)*Math.cos(theta));
    camera.lookAt(target);
  }
  updateCam();
  canvas.addEventListener('mousedown',e=>{dragging=true;prev={x:e.clientX,y:e.clientY};});
  window.addEventListener('mouseup',()=>dragging=false);
  window.addEventListener('mousemove',e=>{
    if(!dragging)return;
    theta-=(e.clientX-prev.x)*0.009;
    phi=Math.max(0.08,Math.min(Math.PI-0.08,phi-(e.clientY-prev.y)*0.009));
    prev={x:e.clientX,y:e.clientY};updateCam();
  });
  let pt=null;
  canvas.addEventListener('touchstart',e=>{pt=e.touches[0];},{passive:true});
  canvas.addEventListener('touchmove',e=>{
    if(!pt)return;const t=e.touches[0];
    theta-=(t.clientX-pt.clientX)*0.011;
    phi=Math.max(0.08,Math.min(Math.PI-0.08,phi-(t.clientY-pt.clientY)*0.011));
    pt=t;updateCam();e.preventDefault();
  },{passive:false});
  canvas.addEventListener('wheel',e=>{
    radius=Math.max(3,Math.min(55,radius+e.deltaY*0.025));updateCam();e.preventDefault();
  },{passive:false});
  canvas.addEventListener('dblclick',()=>{theta=0.6;phi=0.75;radius=12;target.set(0,0,0);updateCam();});
  let raf;
  function animate(){raf=requestAnimationFrame(animate);renderer.render(scene,camera);}
  animate();
  const ro=new ResizeObserver(()=>{
    const w=canvas.offsetWidth,h=canvas.offsetHeight;
    renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
  });
  ro.observe(canvas);
  return{
    scene,camera,renderer,
    clearScene(){const t=[];scene.traverse(o=>{if(o.isMesh||o.isLine||o.isLineSegments)t.push(o);});t.forEach(o=>scene.remove(o));},
    setRadius(r){radius=r;updateCam();},
    reset(){theta=0.6;phi=0.75;radius=12;target.set(0,0,0);updateCam();},
    destroy(){cancelAnimationFrame(raf);ro.disconnect();renderer.dispose();}
  };
}
// PRIMITIVES
function mkAtom(pos,hex,r){
  const geo=new THREE.SphereGeometry(r,24,24);
  const mat=new THREE.MeshPhongMaterial({color:new THREE.Color(hex),shininess:90,specular:new THREE.Color(0x444466),transparent:true,opacity:0.93});
  const m=new THREE.Mesh(geo,mat);m.position.set(...pos);return m;
}
function mkBond(p1,p2,hex=0x556677,r=0.045){
  const v1=new THREE.Vector3(...p1),v2=new THREE.Vector3(...p2);
  const dir=new THREE.Vector3().subVectors(v2,v1),len=dir.length();
  if(len<0.001)return null;
  const geo=new THREE.CylinderGeometry(r,r,len,8,1);
  const mat=new THREE.MeshPhongMaterial({color:new THREE.Color(hex),transparent:true,opacity:0.42,shininess:20});
  const m=new THREE.Mesh(geo,mat);
  const mid=new THREE.Vector3().addVectors(v1,v2).multiplyScalar(0.5);
  m.position.copy(mid);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
  return m;
}
function addObj(scene,obj){if(obj)scene.add(obj);}
function dist(a,b){return Math.sqrt(a.map((v,i)=>(v-b[i])**2).reduce((s,x)=>s+x,0));}
function autoBonds(scene,posArr,cutoff,hex=0x556677,r=0.045){
  for(let i=0;i<posArr.length;i++)for(let j=i+1;j<posArr.length;j++){
    if(dist(posArr[i],posArr[j])<cutoff)addObj(scene,mkBond(posArr[i],posArr[j],hex,r));
  }
}

function orthoBox(a,b,c,col=0x3355cc){
  const mat=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:0.38});
  const h=[a/2,b/2,c/2];
  const v=[[-h[0],-h[1],-h[2]],[h[0],-h[1],-h[2]],[h[0],h[1],-h[2]],[-h[0],h[1],-h[2]],
           [-h[0],-h[1],h[2]],[h[0],-h[1],h[2]],[h[0],h[1],h[2]],[-h[0],h[1],h[2]]];
  const idx=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  const pts=[];idx.forEach(([i,j])=>{pts.push(new THREE.Vector3(...v[i]));pts.push(new THREE.Vector3(...v[j]));});
  return new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),mat);
}
function cubicBox(a,col=0x3355cc){return orthoBox(a,a,a,col);}

  const b1=b0.map(([x,y])=>[x-cx,y-cy,-cz]);
  const b2=b0.map(([x,y])=>[x-cx,y-cy,+cz]);
  const pairs=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  const all=[...b1,...b2];const pts=[];
  pairs.forEach(([i,j])=>{pts.push(new THREE.Vector3(...all[i]));pts.push(new THREE.Vector3(...all[j]));});
  return new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),mat);
}
function hexConvBox(a,c,col=0x3355cc){
  const mat=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:0.36});
  const s3=Math.sqrt(3)/2;
  const base=[[a,0],[a/2,a*s3],[- a/2,a*s3],[-a,0],[-a/2,-a*s3],[a/2,-a*s3]];
  const pts=[];
  for(let i=0;i<6;i++){
    const n=(i+1)%6;
    pts.push(new THREE.Vector3(base[i][0],base[i][1],-c/2));pts.push(new THREE.Vector3(base[n][0],base[n][1],-c/2));
    pts.push(new THREE.Vector3(base[i][0],base[i][1],c/2));pts.push(new THREE.Vector3(base[n][0],base[n][1],c/2));
    pts.push(new THREE.Vector3(base[i][0],base[i][1],-c/2));pts.push(new THREE.Vector3(base[i][0],base[i][1],c/2));
  }
  return new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),mat);
}
function h2c(fx,fy,fz,a,c){return[fx*a+fy*a/2,fy*a*Math.sqrt(3)/2,fz*c];}

            ${cr.origin?`<div><div class="info-caption">结构起源</div><div class="info-text">${cr.origin}</div></div>`:''}
            ${cr.features?`<div><div class="info-caption">结构特征</div><div class="info-text">${cr.features}</div></div>`:''}
            ${cr.insight?`<div><div class="info-caption">关键洞见</div><div class="info-text">${cr.insight}</div></div>`:''}
            ${propsRows?`<div><div class="info-caption">物理性质</div><table class="field-list"><tbody>${propsRows}</tbody></table></div>`:''}
            ${relatedItems?`<div><div class="info-caption">相关结构</div><div class="related-list">${relatedItems}</div></div>`:''}
            ${atomLegend?`<div><div class="info-caption">原子图例</div><div class="atom-legend">${atomLegend}</div></div>`:''}
          </div>
        </div>`;
      main.appendChild(sec);
    });
  });

  // init viewers after DOM ready
  requestAnimationFrame(()=>{
    CRYSTALS.forEach(cr=>{
      const canvas=document.getElementById('cv_'+cr.id);
      if(!canvas)return;
      const wrap=document.getElementById('wrap_'+cr.id);
      if(wrap){const s=Math.min(wrap.offsetWidth,480);canvas.style.height=s+'px';}
      const v=createViewer(canvas);
      viewers[cr.id]={viewer:v,mode:'prim'};
      try{cr.buildPrim(v.scene,v);}catch(e){console.warn(cr.id,e);}
      const btnP=document.getElementById('btn_prim_'+cr.id);
      const btnS=document.getElementById('btn_super_'+cr.id);
      if(btnP&&btnS){
        btnP.onclick=()=>{
          const s=viewers[cr.id];if(s.mode==='prim')return;
          s.mode='prim';btnP.classList.add('active');btnS.classList.remove('active');
          s.viewer.clearScene();s.viewer.reset();
          try{cr.buildPrim(s.viewer.scene,s.viewer);}catch(e){}
        };
        btnS.onclick=()=>{
          const s=viewers[cr.id];if(s.mode==='super')return;
          s.mode='super';btnS.classList.add('active');btnP.classList.remove('active');
          s.viewer.clearScene();s.viewer.reset();
          try{cr.buildSuper(s.viewer.scene,s.viewer);}catch(e){}
        };
      }
    });
    // highlight sidebar on scroll
    const observer=new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        if(e.isIntersecting){
          const id=e.target.id.replace('sec_','');
          document.querySelectorAll('.wy-menu-vertical li').forEach(li=>li.classList.remove('current'));
          const li=document.getElementById('nav_'+id);
          if(li){li.classList.add('current');li.scrollIntoView({block:'nearest'});}
        }
      });
    },{threshold:0.2,rootMargin:'-60px 0px 0px 0px'});
    document.querySelectorAll('.crystal-section').forEach(s=>observer.observe(s));
  });
}
function filterNav(query){
  const q=query.toLowerCase();
  document.querySelectorAll('.wy-menu-vertical li').forEach(li=>{
    li.style.display=(!q||li.textContent.toLowerCase().includes(q))?'':'none';
  });
  document.querySelectorAll('.wy-menu-vertical p.caption').forEach(p=>{
    const ul=p.nextElementSibling;
    const vis=ul&&[...ul.querySelectorAll('li')].some(li=>li.style.display!=='none');
    p.style.display=vis?'':'none';
  });
}
buildPage();
</script>
