<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晶体结构博物馆 · Crystal Structure Museum</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400&family=Noto+Serif+SC:wght@300;400&display=swap');
:root{--bg:#ffffff;--panel:#f8f9fa;--border:#e5e7eb;--accent:#2563eb;--text:#1f2937;--dim:#6b7280;--note-bg:#eff6ff;--note-border:#3b82f6;--note-text:#1e40af;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.7;overflow-x:hidden;}
/* HEADER */
.site-header{padding:18px 48px;border-bottom:1px solid var(--border);background:#fff;display:flex;align-items:baseline;gap:20px;flex-wrap:wrap;}
.site-title{font-size:1.05rem;font-weight:700;color:var(--text);white-space:nowrap;}
.site-title span{color:var(--accent);}
.site-desc{font-size:.82rem;color:var(--dim);flex:1;min-width:200px;}
.site-meta{display:flex;gap:20px;margin-left:auto;}
.meta-item{display:flex;align-items:baseline;gap:4px;}
.meta-num{font-size:.95rem;font-weight:700;color:var(--accent);font-family:'DM Mono',monospace;}
.meta-label{font-size:.68rem;color:var(--dim);}
/* NAV */
nav{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--border);padding:0 48px;display:flex;align-items:center;gap:4px;height:40px;overflow-x:auto;}
nav::-webkit-scrollbar{height:2px;}
.nav-group{display:flex;align-items:center;gap:3px;padding:0 8px;border-left:1px solid var(--border);}
.nav-group:first-child{border-left:none;padding-left:0;}
.nav-group-label{font-size:.6rem;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;white-space:nowrap;margin-right:2px;font-family:'DM Mono',monospace;}
.nav-chip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:3px;border:1px solid transparent;font-size:.68rem;cursor:pointer;white-space:nowrap;transition:all .12s;background:transparent;color:var(--dim);font-family:inherit;}
.nav-chip:hover,.nav-chip.active{background:var(--note-bg);border-color:rgba(59,130,246,.3);color:var(--accent);}
.nav-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
/* MAIN */
main{max-width:960px;margin:0 auto;padding:48px 48px 80px;}
/* DIVIDER */
.bravais-divider{display:flex;align-items:center;gap:14px;margin:64px 0 28px;}
.bravais-label{font-size:.95rem;font-weight:600;color:var(--text);white-space:nowrap;font-family:'DM Mono',monospace;}
.bravais-line{flex:1;height:1px;background:var(--border);}
.bravais-sub{font-size:.62rem;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;font-family:'DM Mono',monospace;}
/* SECTION */
.crystal-section{margin-bottom:72px;scroll-margin-top:50px;}
.section-header{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid var(--border);}
.section-number{font-size:.7rem;font-weight:600;color:var(--dim);font-family:'DM Mono',monospace;line-height:2.6;flex-shrink:0;letter-spacing:.05em;}
.section-titles{flex:1;}
.section-en{font-size:1.3rem;font-weight:700;line-height:1.2;margin-bottom:2px;color:var(--text);}
.section-zh{font-size:.82rem;color:var(--dim);margin-bottom:7px;}
.section-formula{display:inline-block;background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:1px 8px;font-size:.78rem;color:var(--text);font-family:'DM Mono',monospace;}
.section-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;}
.tag{padding:1px 7px;border-radius:3px;font-size:.6rem;letter-spacing:.04em;text-transform:uppercase;border:1px solid;font-family:'DM Mono',monospace;}
.tag-oxide{color:#be185d;border-color:rgba(190,24,93,.2);background:rgba(190,24,93,.04);}
.tag-metal{color:#78350f;border-color:rgba(120,53,15,.2);background:rgba(120,53,15,.04);}
.tag-halide{color:#065f46;border-color:rgba(6,95,70,.2);background:rgba(6,95,70,.04);}
.tag-sulfide{color:#7c2d12;border-color:rgba(124,45,18,.2);background:rgba(124,45,18,.04);}
.tag-hex{color:#1e40af;border-color:rgba(30,64,175,.2);background:rgba(30,64,175,.04);}
.tag-trig{color:#5b21b6;border-color:rgba(91,33,182,.2);background:rgba(91,33,182,.04);}
.tag-tet{color:#134e4a;border-color:rgba(19,78,74,.2);background:rgba(19,78,74,.04);}
.tag-cub{color:#1d4ed8;border-color:rgba(29,78,216,.2);background:rgba(29,78,216,.04);}
/* NOTE / GLANCE — docs callout style */
.glance-bar{display:flex;align-items:flex-start;gap:10px;background:var(--note-bg);border:1px solid rgba(59,130,246,.18);border-left:3px solid var(--note-border);border-radius:4px;padding:10px 14px;margin-bottom:16px;}
.glance-label{font-size:.6rem;letter-spacing:.1em;color:var(--note-border);text-transform:uppercase;white-space:nowrap;margin-right:4px;font-weight:600;font-family:'DM Mono',monospace;}
.glance-text{font-family:'Noto Serif SC',serif;font-size:.85rem;color:var(--note-text);line-height:1.7;}
.compare-note{background:#f0fdf4;border:1px solid rgba(16,185,129,.2);border-left:3px solid #059669;border-radius:4px;padding:10px 14px;font-size:.85rem;color:#065f46;font-family:'Noto Serif SC',serif;line-height:1.7;margin-bottom:16px;}
/* CARD */
.crystal-card{display:grid;grid-template-columns:400px 1fr;gap:24px;align-items:start;}
@media(max-width:900px){.crystal-card{grid-template-columns:1fr;}}
/* CANVAS — keep dark bg for 3D visibility */
.canvas-wrap{position:relative;background:#111827;border:1px solid #374151;border-radius:6px;overflow:hidden;aspect-ratio:1;cursor:grab;}
.canvas-wrap:active{cursor:grabbing;}
canvas.crystal-canvas{width:100%!important;height:100%!important;display:block;}
.view-toggle{position:absolute;top:8px;left:8px;display:flex;gap:3px;z-index:10;}
.vt-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.5);border-radius:3px;padding:2px 8px;font-size:.58rem;cursor:pointer;font-family:'DM Mono',monospace;transition:all .12s;}
.vt-btn.active{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.5);color:#fff;}
.canvas-badge{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.5);border-radius:3px;padding:2px 7px;font-size:.52rem;color:rgba(255,255,255,.4);}
/* INFO — docs content style */
.info-panel{display:flex;flex-direction:column;gap:14px;}
.info-block{border-left:2px solid var(--border);padding:0 0 0 14px;}
.info-block-title{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;font-weight:600;font-family:'DM Mono',monospace;}
.info-block p{font-size:.9rem;line-height:1.85;color:var(--text);font-family:'Noto Serif SC',serif;}
.props-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.prop-item{background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:7px 10px;}
.prop-label{font-size:.58rem;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:2px;font-family:'DM Mono',monospace;}
.prop-value{font-size:.82rem;color:var(--text);font-family:'DM Mono',monospace;font-weight:600;}
.related-list{display:flex;flex-wrap:wrap;gap:5px;}
.related-chip{padding:2px 8px;background:var(--panel);border:1px solid var(--border);border-radius:3px;font-size:.7rem;color:var(--text);}
.atom-legend{display:flex;flex-wrap:wrap;gap:8px;}
.atom-item{display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--text);}
.atom-swatch{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
footer{border-top:1px solid var(--border);padding:16px 48px;text-align:center;color:var(--dim);font-size:.7rem;background:var(--panel);}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:rgba(37,99,235,.18);border-radius:2px;}
</style>
</head>

  <div class="site-title">经典<span>晶体结构</span>交互课堂</div>

</header>
<nav id="mainNav">

function createViewer(canvas){
  const W=canvas.offsetWidth||420,H=canvas.offsetHeight||420;
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(W,H);renderer.setClearColor(0x10101c,1);
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(42,W/H,0.01,300);
  scene.add(new THREE.AmbientLight(0xffffff,0.55));
  const d1=new THREE.DirectionalLight(0xffffff,0.9);d1.position.set(6,10,8);scene.add(d1);
  const d2=new THREE.DirectionalLight(0x8899ff,0.35);d2.position.set(-5,-4,-6);scene.add(d2);
  const d3=new THREE.DirectionalLight(0xffffff,0.2);d3.position.set(0,-8,0);scene.add(d3);
  let theta=0.6,phi=0.75,radius=12,dragging=false,prev={x:0,y:0};
  const target=new THREE.Vector3(0,0,0);
  function updateCam(){
    camera.position.set(
      target.x+radius*Math.sin(phi)*Math.sin(theta),
      target.y+radius*Math.cos(phi),
      target.z+radius*Math.sin(phi)*Math.cos(theta));
    camera.lookAt(target);
  }
  updateCam();
  canvas.addEventListener('mousedown',e=>{dragging=true;prev={x:e.clientX,y:e.clientY};});
  window.addEventListener('mouseup',()=>dragging=false);
  window.addEventListener('mousemove',e=>{
    if(!dragging)return;
    theta-=(e.clientX-prev.x)*0.009;
    phi=Math.max(0.08,Math.min(Math.PI-0.08,phi-(e.clientY-prev.y)*0.009));
    prev={x:e.clientX,y:e.clientY};updateCam();
  });
  let pt=null;
  canvas.addEventListener('touchstart',e=>{pt=e.touches[0];},{passive:true});
  canvas.addEventListener('touchmove',e=>{
    if(!pt)return;const t=e.touches[0];
    theta-=(t.clientX-pt.clientX)*0.011;
    phi=Math.max(0.08,Math.min(Math.PI-0.08,phi-(t.clientY-pt.clientY)*0.011));
    pt=t;updateCam();e.preventDefault();
  },{passive:false});
  canvas.addEventListener('wheel',e=>{
    radius=Math.max(3,Math.min(55,radius+e.deltaY*0.025));updateCam();e.preventDefault();
  },{passive:false});
  canvas.addEventListener('dblclick',()=>{theta=0.6;phi=0.75;radius=12;target.set(0,0,0);updateCam();});
  let raf;
  function animate(){raf=requestAnimationFrame(animate);renderer.render(scene,camera);}
  animate();
  const ro=new ResizeObserver(()=>{
    const w=canvas.offsetWidth,h=canvas.offsetHeight;
    renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
  });
  ro.observe(canvas);
  return{
    scene,camera,renderer,
    clearScene(){const t=[];scene.traverse(o=>{if(o.isMesh||o.isLine||o.isLineSegments)t.push(o);});t.forEach(o=>scene.remove(o));},
    setRadius(r){radius=r;updateCam();},
    reset(){theta=0.6;phi=0.75;radius=12;target.set(0,0,0);updateCam();},
    destroy(){cancelAnimationFrame(raf);ro.disconnect();renderer.dispose();}
  };
}
// PRIMITIVES
function mkAtom(pos,hex,r){
  const geo=new THREE.SphereGeometry(r,24,24);
  const mat=new THREE.MeshPhongMaterial({color:new THREE.Color(hex),shininess:90,specular:new THREE.Color(0x444466),transparent:true,opacity:0.93});
  const m=new THREE.Mesh(geo,mat);m.position.set(...pos);return m;
}
function mkBond(p1,p2,hex=0x556677,r=0.045){
  const v1=new THREE.Vector3(...p1),v2=new THREE.Vector3(...p2);
  const dir=new THREE.Vector3().subVectors(v2,v1),len=dir.length();
  if(len<0.001)return null;
  const geo=new THREE.CylinderGeometry(r,r,len,8,1);
  const mat=new THREE.MeshPhongMaterial({color:new THREE.Color(hex),transparent:true,opacity:0.42,shininess:20});
  const m=new THREE.Mesh(geo,mat);
  const mid=new THREE.Vector3().addVectors(v1,v2).multiplyScalar(0.5);
  m.position.copy(mid);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
  return m;
}
function addObj(scene,obj){if(obj)scene.add(obj);}
function dist(a,b){return Math.sqrt(a.map((v,i)=>(v-b[i])**2).reduce((s,x)=>s+x,0));}
function autoBonds(scene,posArr,cutoff,hex=0x556677,r=0.045){
  for(let i=0;i<posArr.length;i++)for(let j=i+1;j<posArr.length;j++){
    if(dist(posArr[i],posArr[j])<cutoff)addObj(scene,mkBond(posArr[i],posArr[j],hex,r));
  }
}

function orthoBox(a,b,c,col=0x3355cc){
  const mat=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:0.38});
  const h=[a/2,b/2,c/2];
  const v=[[-h[0],-h[1],-h[2]],[h[0],-h[1],-h[2]],[h[0],h[1],-h[2]],[-h[0],h[1],-h[2]],
           [-h[0],-h[1],h[2]],[h[0],-h[1],h[2]],[h[0],h[1],h[2]],[-h[0],h[1],h[2]]];
  const idx=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  const pts=[];idx.forEach(([i,j])=>{pts.push(new THREE.Vector3(...v[i]));pts.push(new THREE.Vector3(...v[j]));});
  return new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),mat);
}
function cubicBox(a,col=0x3355cc){return orthoBox(a,a,a,col);}
function hexPrimBox(a,c,col=0x3355cc){
  const mat=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:0.38});
  const s3=Math.sqrt(3);
  const cx=3*a/4,cy=a*s3/4,cz=c/2;
  const b0=[[0,0,0],[a,0,0],[a+a/2,a*s3/2,0],[a/2,a*s3/2,0]];
  const b1=b0.map(([x,y])=>[x-cx,y-cy,-cz]);
  const b2=b0.map(([x,y])=>[x-cx,y-cy,+cz]);
  const pairs=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  const all=[...b1,...b2];const pts=[];
  pairs.forEach(([i,j])=>{pts.push(new THREE.Vector3(...all[i]));pts.push(new THREE.Vector3(...all[j]));});
  return new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),mat);
}
function hexConvBox(a,c,col=0x3355cc){
  const mat=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:0.36});
  const s3=Math.sqrt(3)/2;
  const base=[[a,0],[a/2,a*s3],[- a/2,a*s3],[-a,0],[-a/2,-a*s3],[a/2,-a*s3]];
  const pts=[];
  for(let i=0;i<6;i++){
    const n=(i+1)%6;
    pts.push(new THREE.Vector3(base[i][0],base[i][1],-c/2));pts.push(new THREE.Vector3(base[n][0],base[n][1],-c/2));
    pts.push(new THREE.Vector3(base[i][0],base[i][1],c/2));pts.push(new THREE.Vector3(base[n][0],base[n][1],c/2));
    pts.push(new THREE.Vector3(base[i][0],base[i][1],-c/2));pts.push(new THREE.Vector3(base[i][0],base[i][1],c/2));
  }
  return new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),mat);
}
function h2c(fx,fy,fz,a,c){return[fx*a+fy*a/2,fy*a*Math.sqrt(3)/2,fz*c];}

  requestAnimationFrame(()=>{
    CRYSTALS.forEach(cr=>{
      const canvas=document.getElementById('cv_'+cr.id);
      if(!canvas)return;
      const wrap=document.getElementById('wrap_'+cr.id);
      if(wrap){const s=Math.min(wrap.offsetWidth,480);canvas.style.height=s+'px';}
      const v=createViewer(canvas);
      viewers[cr.id]={viewer:v,mode:'prim'};
      try{cr.buildPrim(v.scene,v);}catch(e){console.warn(cr.id,e);}
      // toggle buttons
      const btnP=document.getElementById('btn_prim_'+cr.id);
      const btnS=document.getElementById('btn_super_'+cr.id);
      if(btnP&&btnS){
        btnP.onclick=()=>{
          const s=viewers[cr.id];
          if(s.mode==='prim')return;
          s.mode='prim';btnP.classList.add('active');btnS.classList.remove('active');
          s.viewer.clearScene();s.viewer.reset();
          try{cr.buildPrim(s.viewer.scene,s.viewer);}catch(e){}
        };
        btnS.onclick=()=>{
          const s=viewers[cr.id];
          if(s.mode==='super')return;
          s.mode='super';btnS.classList.add('active');btnP.classList.remove('active');
          s.viewer.clearScene();s.viewer.reset();
          try{cr.buildSuper(s.viewer.scene,s.viewer);}catch(e){}
        };
      }
    });
    // nav intersection observer
    const observer=new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        if(e.isIntersecting){
          const id=e.target.id.replace('sec_','');
          document.querySelectorAll('.nav-chip').forEach(c=>c.classList.remove('active'));
          const chip=document.getElementById('chip_'+id);
          if(chip)chip.classList.add('active');
        }
      });
    },{threshold:0.2,rootMargin:'-60px 0px 0px 0px'});
    document.querySelectorAll('.crystal-section').forEach(s=>observer.observe(s));
  });
}
buildPage();
</script>
</body>
</html>
