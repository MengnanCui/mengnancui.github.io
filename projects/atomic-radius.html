<title>Periodic Table &mdash; Atomic &amp; Ionic Radii</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #ffffff;
  color: #1a1a2e;
  font-family: 'JetBrains Mono', monospace;
  overflow-x: auto;
  min-height: 100vh;
}

.header {
  position: relative;
  text-align: center;
  padding: 14px 20px 4px;
}
.header h1 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 4px;
  color: #1a1a2e;
  text-transform: uppercase;
}
.header p {
  font-size: 10px;
  color: #777;
  margin-top: 3px;
  letter-spacing: 1px;
}
.back-link {
  position: absolute;
  top: 14px;
  left: 20px;
  font-size: 11px;
  color: #666;
  text-decoration: none;
  font-weight: 600;
  letter-spacing: 1px;
}
.back-link:hover { color: #1a4fc4; }

.controls-panel {
  background: #f5f6f8;
  border-top: 1px solid #ddd;
  border-bottom: 1px solid #ddd;
  padding: 7px 16px;
}
.controls-row {
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
  padding: 3px 0;
}
.controls-row + .controls-row {
  border-top: 1px dashed #ddd;
  margin-top: 5px;
  padding-top: 5px;
}
.ctrl-group { display: flex; align-items: center; gap: 5px; }
.ctrl-label { font-size: 10px; font-weight: 600; color: #555; white-space: nowrap; }
.ctrl-sep { font-size: 10px; color: #ccc; }
input[type="range"] { width: 85px; accent-color: #2255cc; cursor: pointer; }
select {
  background: #fff; color: #1a1a2e;
  border: 1.5px solid #bbb; border-radius: 4px;
  font-family: inherit; font-size: 10px; font-weight: 600;
  cursor: pointer; padding: 2px 5px;
}
input[type="color"] {
  width: 28px; height: 20px; padding: 1px 2px;
  border: 1.5px solid #bbb; border-radius: 3px; cursor: pointer;
}
.val-display { font-size: 10px; color: #2255cc; font-weight: 700; min-width: 28px; }

.legend {
  display: flex; justify-content: center; gap: 12px;
  padding: 5px 16px 6px; flex-wrap: wrap;
  border-bottom: 1px solid #eee;
}
.legend-item { display: flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; color: #333; }
.legend-circle { width: 10px; height: 10px; border-radius: 50%; border: 2px solid; flex-shrink: 0; }

.table-container { display: flex; justify-content: center; padding: 6px 12px 20px; overflow-x: auto; }
.grid { display: grid; grid-template-columns: repeat(18, 1fr); gap: 1px; }
.cell { display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; transition: transform 0.12s; }
.cell:hover { transform: scale(1.2); z-index: 100; }
.cell.empty { pointer-events: none; }
.cell svg { overflow: visible; }
.cell .symbol {
  position: absolute; font-weight: 700; pointer-events: none; z-index: 2;
  text-shadow: 0 0 4px rgba(255,255,255,1), 0 0 8px rgba(255,255,255,0.95), 0 0 14px rgba(255,255,255,0.8);
}
.lanthanide-label, .actinide-label { font-size: 8px; font-weight: 600; color: #999; display: flex; align-items: center; justify-content: center; }
.separator { grid-column: 1 / -1; height: 7px; }

.tooltip {
  display: none; position: fixed; background: #fff;
  border: 2px solid #ddd; border-radius: 8px; padding: 12px;
  z-index: 1000; min-width: 240px; max-width: 340px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.15); pointer-events: none;
  font-family: 'JetBrains Mono', monospace;
}
.tooltip.show { display: block; }
.tooltip h3 { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
.tooltip .tp-sub { font-size: 10px; color: #666; margin-bottom: 7px; }
.tooltip .tp-row { display: flex; justify-content: space-between; font-size: 10px; padding: 2px 0; border-bottom: 1px solid #f2f2f2; }
.tooltip .tp-row span:first-child { color: #999; }
.tooltip .tp-row span:last-child { font-weight: 700; color: #1a1a2e; }
.tooltip .tp-vis { display: flex; align-items: center; justify-content: center; margin-top: 8px; }
</style>
</head>

const catNames = {

  "post-transition":"Post-transition", metalloid:"Metalloid", nonmetal:"Nonmetal",
  halogen:"Halogen", noble:"Noble Gas", lanthanide:"Lanthanide", actinide:"Actinide"

let scale        = 0.85;
let displayMode  = "both";

let cellSize     = 56;

function buildLegend() {
  const legend = document.getElementById("legend");
  legend.innerHTML = "";
  Object.entries(catColors).forEach(([cat, color]) => {
    const item = document.createElement("div");
    item.className = "legend-item";
    item.innerHTML = `<div class="legend-circle" style="border-color:${color}"></div>${catNames[cat]}`;
    legend.appendChild(item);

  a.className = "legend-item";
  a.style.marginLeft = "8px";
  a.innerHTML = `<svg width="12" height="12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="#222" stroke-width="2"/></svg>Atomic Radius`;

  }

function buildGrid() {
  buildLegend();
  const showIon = displayMode !== "atomic";
  document.getElementById("opacityGroup").style.display = showIon ? "flex" : "none";
  document.getElementById("opSep").style.display        = showIon ? "inline" : "none";

  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  grid.style.minWidth = (cellSize * 18 + 18) + "px";

  for (let row = 1; row <= 7; row++) {
    for (let col = 1; col <= 18; col++) {
      const el = elements.find(e => e[3] === row && e[4] === col);
      if (row === 6 && col === 3) {
        const lu = elements.find(e => e[0] === 71);
        grid.appendChild(lu ? createCell(lu) : createEmptyCell());
      } else if (row === 7 && col === 3) {
        const lr = elements.find(e => e[0] === 103);
        grid.appendChild(lr ? createCell(lr) : createEmptyCell());
      } else {
        grid.appendChild(el ? createCell(el) : createEmptyCell());
      }
    }
  }

  const sep = document.createElement("div");
  sep.className = "separator";
  grid.appendChild(sep);

  for (let i = 0; i < 3; i++) {
    const d = document.createElement("div");
    d.style.width = cellSize + "px"; d.style.height = cellSize + "px";
    if (i === 0) { d.className = "lanthanide-label"; d.textContent = "Lanthanides 57–70"; }
    else d.className = "cell empty";
    grid.appendChild(d);
  }
  for (let col = 4; col <= 17; col++) {
    const el = elements.find(e => e[3] === 9 && e[4] === col);
    grid.appendChild(el ? createCell(el) : createEmptyCell());
  }
  grid.appendChild(createEmptyCell());

  for (let i = 0; i < 3; i++) {
    const d = document.createElement("div");
    d.style.width = cellSize + "px"; d.style.height = cellSize + "px";
    if (i === 0) { d.className = "actinide-label"; d.textContent = "Actinides 89–102"; }
    else d.className = "cell empty";
    grid.appendChild(d);
  }
  for (let col = 4; col <= 17; col++) {
    const el = elements.find(e => e[3] === 10 && e[4] === col);
    grid.appendChild(el ? createCell(el) : createEmptyCell());
  }
  grid.appendChild(createEmptyCell());
}

function createEmptyCell() {
  const d = document.createElement("div");
  d.className = "cell empty";
  d.style.width = cellSize + "px"; d.style.height = cellSize + "px";
  return d;
}

function createCell(el) {
  if (!el) return createEmptyCell();
  const [Z, sym, name, row, col, cat, atomicR, ions] = el;
  const color = catColors[cat] || "#1a4fc4";

  const div = document.createElement("div");
  div.className = `cell cat-${cat}`;
  div.style.width = cellSize + "px"; div.style.height = cellSize + "px";

  const symSpan = document.createElement("span");
  symSpan.className = "symbol";
  symSpan.style.fontSize = symFontSize + "px";
  symSpan.style.color = symColorMode === "black" ? "#000000"
                      : symColorMode === "category" ? color
                      : symColorCustom;
  symSpan.textContent = sym;
  div.appendChild(symSpan);

  const svgNS = "http://www.w3.org/2000/svg";
  const S = cellSize;
  const H = S / 2;
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("width", S); svg.setAttribute("height", S);
  svg.setAttribute("viewBox", `${-H} ${-H} ${S} ${S}`);
  const maxR = H * 0.88;

  const validIons = ions.filter(ion => ion[1] != null);

  if (validIons.length > 0 && (displayMode === "both" || displayMode === "ionic")) {
    const sorted = [...validIons].sort((a, b) => b[1] - a[1]);
    sorted.forEach((ion, i) => {
      const r = Math.max(2, Math.min((ion[1] / maxAtomicR) * maxR * scale, maxR));
      const fillOp  = Math.max(0.06, ionOpacity * (1 - i * 0.15));
      const strokeOp = Math.min(fillOp + 0.35, 1);
      const circ = document.createElementNS(svgNS, "circle");
      circ.setAttribute("cx","0"); circ.setAttribute("cy","0"); circ.setAttribute("r", r);
      circ.setAttribute("fill", color);
      circ.setAttribute("fill-opacity",   fillOp.toFixed(2));
      circ.setAttribute("stroke", color);
      circ.setAttribute("stroke-width",   "1.0");
      circ.setAttribute("stroke-opacity", strokeOp.toFixed(2));
      svg.appendChild(circ);
    });

    const labeled = sorted.slice(0, 4);
    const nL = labeled.length;
    const lblHalf = ionLabelSize * 0.75;
    const symRadius = symFontSize * 0.55;
    const haloW = Math.max(1.2, ionLabelSize * 0.35);
    labeled.forEach((ion, i) => {
      const r = Math.max(2, Math.min((ion[1] / maxAtomicR) * maxR * scale, maxR));
      const ang = -Math.PI / 2 + (2 * Math.PI * i / nL);
      const posR = r >= symRadius + lblHalf * 2 + 1.5
                 ? r - lblHalf - 1
                 : r + lblHalf + 1;
      const lx = (posR * Math.cos(ang)).toFixed(1);
      const ly = (posR * Math.sin(ang)).toFixed(1);
      const t = document.createElementNS(svgNS, "text");
      t.setAttribute("x", lx); t.setAttribute("y", ly);
      t.setAttribute("text-anchor","middle"); t.setAttribute("dominant-baseline","central");
      t.setAttribute("fill","#000000");
      t.setAttribute("stroke","#ffffff");
      t.setAttribute("stroke-width", haloW.toFixed(2));
      t.setAttribute("stroke-linejoin","round");
      t.setAttribute("paint-order","stroke");
      t.setAttribute("font-size", ionLabelSize);
      t.setAttribute("font-family","JetBrains Mono, monospace");
      t.setAttribute("font-weight","700");
      t.textContent = ion[0];
      svg.appendChild(t);
    });
  }

  if (atomicR && (displayMode === "both" || displayMode === "atomic")) {
    const r = Math.max(3, Math.min((atomicR / maxAtomicR) * maxR * scale, maxR));
    const c = document.createElementNS(svgNS, "circle");
    c.setAttribute("cx","0"); c.setAttribute("cy","0"); c.setAttribute("r", r);
    c.setAttribute("fill","none");
    c.setAttribute("stroke", color);
    c.setAttribute("stroke-width", strokeW);
    c.setAttribute("stroke-opacity","0.95");
    svg.appendChild(c);
  }

  if (!atomicR && validIons.length === 0) {
    const c = document.createElementNS(svgNS, "circle");
    c.setAttribute("cx","0"); c.setAttribute("cy","0"); c.setAttribute("r","3");
    c.setAttribute("fill", color); c.setAttribute("fill-opacity","0.15");
    c.setAttribute("stroke", color); c.setAttribute("stroke-width","1");
    svg.appendChild(c);
  }

  div.appendChild(svg);
  div.addEventListener("mouseenter", e => showTooltip(e, el));
  div.addEventListener("mousemove",  moveTooltip);
  div.addEventListener("mouseleave", hideTooltip);
  return div;
}

function showTooltip(e, el) {
  const [Z, sym, name, row, col, cat, atomicR, ions] = el;
  const color = catColors[cat] || "#1a4fc4";
  const tt = document.getElementById("tooltip");

  let html = `<h3 style="color:${color}">${name} ${sym}</h3>`;
  html += `<div class="tp-sub">Z=${Z} · ${catNames[cat]}</div>`;
  if (atomicR) html += `<div class="tp-row"><span>Atomic radius</span><span>${atomicR} pm</span></div>`;
  ions.forEach(ion => {
    if (ion[1]) html += `<div class="tp-row"><span>${sym}<sup>${ion[0]}</sup> ion</span><span>${ion[1]} pm</span></div>`;
  });

  const vi = ions.filter(ion => ion[1] != null);
  if (atomicR || vi.length > 0) {
    const all = [atomicR, ...vi.map(i => i[1])].filter(Boolean);
    const mx  = Math.max(...all);
    const tR  = 52;
    html += `<div class="tp-vis"><svg width="200" height="120" viewBox="-100 -60 200 120">`;
    const ionsSorted = [...vi].sort((a,b) => b[1]-a[1]);
    const nT = ionsSorted.length;
    ionsSorted.forEach((ion, i) => {
      const r = (ion[1]/mx)*tR;
      const op = (0.45 - i*0.1).toFixed(2);
      html += `<circle cx="0" cy="0" r="${r.toFixed(1)}" fill="${color}" fill-opacity="${op}" stroke="${color}" stroke-width="1"/>`;
    });
    ionsSorted.forEach((ion, i) => {
      const r = (ion[1]/mx)*tR;
      const ang = -Math.PI/2 + (2 * Math.PI * i / nT);
      const labelR = r + 8;
      const lx = (labelR * Math.cos(ang)).toFixed(1);
      const ly = (labelR * Math.sin(ang)).toFixed(1);
      html += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central" fill="#000" stroke="#fff" stroke-width="2.2" paint-order="stroke" font-size="9" font-family="JetBrains Mono" font-weight="700">${ion[0]}:${ion[1]}</text>`;
    });
    if (atomicR) {
      const r = (atomicR/mx)*tR;
      html += `<circle cx="0" cy="0" r="${r.toFixed(1)}" fill="none" stroke="${color}" stroke-width="2.5"/>`;
      html += `<text x="${(r+5).toFixed(1)}" y="-3" fill="${color}" stroke="#fff" stroke-width="2.2" paint-order="stroke" font-size="9" font-family="JetBrains Mono" font-weight="700">${atomicR}pm</text>`;
    }
    html += `</svg></div>`;
  }

  tt.innerHTML = html;
  tt.classList.add("show");
  moveTooltip(e);
}
function moveTooltip(e) {
  const t = document.getElementById("tooltip");
  let x = e.clientX+16, y = e.clientY+16;
  if (x+t.offsetWidth  > window.innerWidth -8) x = e.clientX-t.offsetWidth -16;
  if (y+t.offsetHeight > window.innerHeight-8) y = e.clientY-t.offsetHeight-16;
  t.style.left = x+"px"; t.style.top = y+"px";
}
function hideTooltip() { document.getElementById("tooltip").classList.remove("show"); }

function wire(id, fn, dispId, fmt) {
  document.getElementById(id).addEventListener("input", e => {
    fn(parseFloat(e.target.value));
    if (dispId) document.getElementById(dispId).textContent = fmt(parseFloat(e.target.value));
    buildGrid();
  });
}
wire("scaleSlider",    v => scale        = v, "scaleVal",    v => v.toFixed(2));
wire("opacitySlider",  v => ionOpacity   = v, "opacityVal",  v => Math.round(v*100)+"%");
wire("strokeSlider",   v => strokeW      = v, "strokeVal",   v => v.toFixed(2));
wire("symSizeSlider",  v => symFontSize  = v, "symSizeVal",  v => v+"px");
wire("ionLabelSlider", v => ionLabelSize = v, "ionLabelVal", v => v.toFixed(1));
wire("cellSizeSlider", v => cellSize     = v, "cellSizeVal", v => v+"px");

document.getElementById("displayMode").addEventListener("change", e => {
  displayMode = e.target.value; buildGrid();
});
document.getElementById("symColorMode").addEventListener("change", e => {
  symColorMode = e.target.value;
  document.getElementById("symColorPicker").style.display = symColorMode==="custom" ? "inline-block" : "none";
  buildGrid();
});
document.getElementById("symColorPicker").addEventListener("input", e => {
  symColorCustom = e.target.value; buildGrid();
});

buildGrid();
</script>
</body>
</html>
